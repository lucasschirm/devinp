name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test

  pack:
    name: pack — npm tarball excludes bench/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Asserts (bench/PLAN.md §8.1) that `npm pack` never ships bench/ and
      # that the shipped surfaces (bin/, data/) are still present.
      - run: node scripts/check-pack.js

  bench:
    name: bench (python — unit + mock, zero quota)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bench package (WP0 pin, includes swebench==5.0.2)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e bench/

      - name: Run bench tests (mock only — CI never consumes quota)
        run: pytest bench/
