name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test

  bench:
    name: bench (python — unit + mock, zero quota)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned dependencies (lockfile — includes swebench==5.0.2, pytest, pytest-timeout)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r bench/requirements.lock

      - name: Run bench tests (mock only — CI never consumes quota; bench_live tests need BENCH_LIVE=1 and are excluded by default)
        run: pytest bench/
