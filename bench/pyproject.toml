[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devinp-bench"
version = "0.0.1"
description = "SWE-bench Verified benchmark adapter for devin acp (recon + harness; see bench/PLAN.md)"
requires-python = ">=3.11"
# WP0 pin (issue #10): latest stable swebench at recon time; input format of
# swebench.harness.run_evaluation verified against this version's source.
dependencies = [
    "swebench==5.0.2",
    "pytest>=8",
    # test-only watchdog: the Docker-gated integration tests carry
    # pytest.mark.timeout (a wedged pull must fail the test, not hang the
    # job); without the plugin the marker is inert (a plain warning).
    "pytest-timeout>=2",
]

[tool.pytest.ini_options]
testpaths = ["tests", "probes"]

[tool.setuptools]
# Explicit flat-layout declaration: the only importable modules are
# acp_client + mock_devin + runner + evaluate + report (conftest.py /
# probes / tests are dev-only, notes/ is recon data). Without this,
# setuptools flat-layout discovery fails on the multiple top-level
# directories.
py-modules = ["acp_client", "live_pilot", "mock_devin", "runner",
            "evaluate", "report"]
